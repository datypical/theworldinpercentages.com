name: Report monitor

on:
    schedule:
        - cron: "0 12 * * 2"
    workflow_dispatch:

permissions:
    contents: read
    issues: write

jobs:
    check-reports:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: 0

            - name: Remove previous output
              run: rm -f updates_found.md

            - name: Check for report updates
              run: pnpm check:reports

            - name: Create issue from file
              if: hashFiles('updates_found.md') != ''
              uses: peter-evans/create-issue-from-file@v5
              with:
                  title: "New report editions detected"
                  content-filepath: ./updates_found.md
